<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>
    //Posts the raw data to console 
    //Parses the message to txt and displays it
    const handleResponse = async (response) => {

      // Saves content type read in server.js
      const contentType = response.headers.get('Content-Type');
      const rawTxt = await response.text();
      console.log(rawTxt);

      // Parse method for raw text based content type
      let message;
      if (contentType.includes('text/xml')) {
        const xml = new DOMParser().parseFromString(rawTxt, 'text/xml');
        message = xml.querySelector('message').textContent;
      } 
      else if (contentType.includes('application/json')) {
        const obj = JSON.parse(rawTxt);
        message = obj.message;
      }

      // Gets options selected by user to help display message properly
      const content = document.querySelector('#content');
      const pageSelect = document.querySelector('#page');
      const selectedText = pageSelect.selectedOptions[0].textContent;
      
      content.innerHTML = '';
      content.innerHTML += `<h1>${selectedText}</h1>`;
      content.innerHTML += `<p>Message: ${message}</p>`;
    };

    // Fetch and read data from server.js based on the options selected by user
    const sendPost = async () => {
      const url = document.querySelector('#page').value;
      const dataType = document.querySelector('#type').value;

      const response = await fetch(url, {
        method: 'GET',
        headers: {
          'Accept': dataType,
        },
      });

      await handleResponse(response);
    };

    const init = () => {
      const sendButton = document.querySelector('#send');
      sendButton.addEventListener('click', sendPost);
    };

    window.onload = init;
  </script>
</head>
<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>
</html>
